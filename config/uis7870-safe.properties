# Stable package identities for the UIS7870 coexistence profile.
#
# The vendor group is consumed by:
# - SyMorphe (BuildConfig and package tracking)
# - the derived Morphe patch bundle (GmsCore support)
# - the derived MicroG-RE build (basePackageName)
#
# Keep the production value stable after release. Changing it creates a new,
# unrelated Android application/data namespace.
managerPackage=com.sylong.symorphe
vendorGroup=com.sylong.autopatch
patchedYouTubePackage=com.sylong.autopatch.android.youtube
microgPackage=com.sylong.autopatch.android.gms
profileRevision=2
# Public certificate digest of the existing cloud-signed coexistence MicroG.
# The runtime still requires BOTH the matching package name and this certificate.
microgSignerSha256=7cee829c140e3ba32767e541e98d99a87214b80c7b3095692549131a2d6ebf02

# Exact stable original YouTube build used only as a verified download target by all-in-one builds.
# The proprietary APK is not redistributed inside SyMorphe.
youtubeStableVersion=21.13.164
youtubeStableVersionCode=1561063732
youtubeStableSha256=c193daf879d36e04886c34dcc44580b1c98c20534165d306c2a04b8025fc3f46
youtubeSignerSha256=3d7a1223019aa39d9ea0e3436ab7c0896bfb4fb679f4de5fe7c23f326c8f994a
