name: Build and verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - app-release.json
      - patches-bundle.json
      - "*.md"
      - docs/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: ./.github/actions/setup-toolchain

      - name: Verify or restore official Maven dependencies
        run: python3 tools/ci_retry.py -- python3 tools/prepare_morphe_dependencies.py

      - name: Test release metadata generator
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Lint and reproducible release build
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p verification
          python3 tools/ci_retry.py -- ./gradlew clean testDebugUnitTest lintRelease assembleRelease -PsignAsDebug --stacktrace
          licensed_apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          test -f "$licensed_apk"
          cp "$licensed_apk" verification/SyMorphe-licensed-verification.apk
          python3 tools/ci_retry.py -- ./gradlew clean testDebugUnitTest lintRelease assembleRelease -PsignAsDebug -PnoDeviceLicense --stacktrace
          no_license_apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          test -f "$no_license_apk"
          cp "$no_license_apk" verification/SyMorphe-no-license-verification.apk

      - name: Upload verification APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: symorphe-verification
          if-no-files-found: warn
          compression-level: 0
          path: |
            verification/*.apk
            app/build/reports/**
