name: Build and verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - app-release.json
      - patches-bundle.json
      - "*.md"
      - docs/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Test release metadata generator
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Lint and reproducible release build
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p verification
          ./gradlew clean testDebugUnitTest lintRelease assembleRelease -PsignAsDebug --stacktrace
          licensed_apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          test -f "$licensed_apk"
          cp "$licensed_apk" verification/SyMorphe-licensed-verification.apk
          ./gradlew clean testDebugUnitTest lintRelease assembleRelease -PsignAsDebug -PnoDeviceLicense --stacktrace
          no_license_apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          test -f "$no_license_apk"
          cp "$no_license_apk" verification/SyMorphe-no-license-verification.apk

      - name: Upload verification APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: symorphe-verification
          if-no-files-found: warn
          compression-level: 0
          path: |
            verification/*.apk
            app/build/reports/**
