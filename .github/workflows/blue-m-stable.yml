name: Blue M stable auto-update

on:
  workflow_dispatch:
  schedule:
    - cron: '41 1,7,13,19 * * *'
  push:
    branches: [main]
    paths:
      - 'bluem/**'
      - '.github/workflows/blue-m-stable.yml'

permissions:
  contents: read

concurrency:
  group: blue-m-stable
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Resolve official stable versions
        id: probe
        run: python bluem/cloud.py probe
      - name: Set up Android SDK
        if: steps.probe.outputs.changed == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        if: steps.probe.outputs.changed == 'true'
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Restore verified Google source cache
        if: steps.probe.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: bluem/inputs/youtube-google.apk
          key: blue-m-google-${{ hashFiles('bluem/selection.json') }}
      - name: Build and verify without signing secrets
        if: steps.probe.outputs.changed == 'true'
        run: python bluem/cloud.py assemble
      - name: Pass verified unsigned artifacts
        if: steps.probe.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bluem-unsigned
          path: bluem/dist/
          retention-days: 7
      - name: Save diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bluem-build-diagnostics
          path: |
            bluem/build/*.log
            bluem/build/release/build.log
            bluem/evidence/patch-result.json
          retention-days: 7
  publish:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: bluem-unsigned
          path: bluem/dist
      - name: Sign only after all build checks passed
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          UPDATE_SIGNING_P12_BASE64: ${{ secrets.UPDATE_SIGNING_P12_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          UPDATE_SIGNING_STORE_PASSWORD: ${{ secrets.UPDATE_SIGNING_STORE_PASSWORD }}
          UPDATE_SIGNING_KEY_ALIAS: ${{ secrets.UPDATE_SIGNING_KEY_ALIAS }}
          UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.UPDATE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_dir="$(mktemp -d)"
          trap 'rm -rf -- "$key_dir"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_dir/app.jks"
          printf '%s' "$UPDATE_SIGNING_P12_BASE64" | base64 --decode > "$key_dir/update.p12"
          export SYMORPHE_KEYSTORE_FILE="$key_dir/app.jks"
          export UPDATE_SIGNING_P12_FILE="$key_dir/update.p12"
          unset ANDROID_KEYSTORE_BASE64 UPDATE_SIGNING_P12_BASE64
          python bluem/publish.py prepare
      - name: Publish APKs then atomically update the signed channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bluem/publish.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bluem-publication-receipt
          path: |
            bluem/build/publish-ready/receipt.json
            bluem/build/publish-ready/signing.log
            bluem/build/publish-ready/verification/
          retention-days: 30
