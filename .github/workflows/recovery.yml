name: Recover failed cloud workflows
on:
  workflow_run:
    workflows: ['Signed ecosystem release', 'Sync official stable Manager']
    types: [completed]
  workflow_dispatch:
    inputs:
      failed_run:
        description: Existing run to diagnose; only trusted main runs are eligible
        required: true
        type: string
permissions:
  actions: write
  contents: read
concurrency:
  group: cloud-recovery-${{ github.event.workflow_run.id || inputs.failed_run }}
  cancel-in-progress: false
jobs:
  recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted recovery implementation
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Diagnose and retry within budget
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED_RUN: ${{ inputs.failed_run }}
        run: python3 tools/cloud_recovery.py
      - name: Preserve recovery decision
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-recovery-${{ github.run_id }}
          path: verification/cloud-recovery.json
          if-no-files-found: warn
